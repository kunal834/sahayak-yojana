<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f1">
<title>Yojana Sahayak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="mark" aria-hidden="true">यो</div>
      <div class="brand-text">
        <div class="title" data-i18n="title">Yojana Sahayak</div>
        <div class="status"><span class="dot" id="status-dot"></span><span id="status" data-i18n="connecting">connecting…</span></div>
      </div>
    </div>
    <div class="seg-toggle" role="group" aria-label="Language">
      <button data-lang="en" class="active">EN</button>
      <button data-lang="hi">हिं</button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="chat">
      <svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"/></svg><span data-i18n="tabChat">Ask</span></button>
    <button class="tab" data-tab="elig">
      <svg viewBox="0 0 24 24"><path d="M9 11l2 2 4-4"/><rect x="4" y="4" width="16" height="16" rx="3"/></svg><span data-i18n="tabElig">Eligibility</span></button>
    <button class="tab" data-tab="docs">
      <svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg><span data-i18n="tabDocs">Schemes</span></button>
  </nav>

  <!-- CHAT -->
  <section id="tab-chat" class="panel active">
    <div id="messages" class="messages"></div>
    <div class="composer-wrap">
      <div id="chips" class="chips hidden"></div>
      <form id="composer" class="composer">
        <button type="button" id="mic" class="icon-btn" title="Speak" aria-label="Speak">
          <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <input id="input" autocomplete="off" data-i18n-ph="placeholder" placeholder="Ask about any scheme…">
        <button type="submit" class="send" title="Send" aria-label="Send">
          <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </form>
    </div>
  </section>

  <!-- ELIGIBILITY -->
  <section id="tab-elig" class="panel">
    <div class="page">
      <div class="page-head">
        <h2 data-i18n="eligTitle">Find schemes for you</h2>
        <p data-i18n="eligIntro">Answer what you can. Leave anything you're unsure about blank.</p>
      </div>
      <form id="elig-form" class="card form-card">
        <h3 class="section-label" data-i18n="aboutYou">About you</h3>
        <div class="grid">
          <label><span data-i18n="age">Age</span><input type="number" name="age" min="0" max="120" inputmode="numeric"></label>
          <label><span data-i18n="gender">Gender</span>
            <select name="gender"><option value=""></option>
              <option value="female" data-i18n="female">Female</option>
              <option value="male" data-i18n="male">Male</option>
              <option value="other" data-i18n="other">Other</option></select></label>
          <label><span data-i18n="income">Annual family income (₹)</span><input type="number" name="income" min="0" step="1000" inputmode="numeric"></label>
          <label><span data-i18n="occupation">Occupation</span>
            <select name="occupation"><option value=""></option>
              <option value="farmer" data-i18n="occ_farmer">Farmer</option>
              <option value="student" data-i18n="occ_student">Student</option>
              <option value="street_vendor" data-i18n="occ_vendor">Street vendor</option>
              <option value="business" data-i18n="occ_business">Small business owner</option>
              <option value="unorganised_worker" data-i18n="occ_worker">Daily wage worker</option>
              <option value="private_employee" data-i18n="occ_private">Private job</option>
              <option value="govt_employee" data-i18n="occ_govt">Government employee</option>
              <option value="homemaker" data-i18n="occ_home">Homemaker</option>
              <option value="unemployed" data-i18n="occ_unemp">Unemployed</option></select></label>
          <label><span data-i18n="state">State</span>
            <select name="state"><option value=""></option>
              <option value="maharashtra">Maharashtra</option><option value="uttar_pradesh">Uttar Pradesh</option>
              <option value="bihar">Bihar</option><option value="madhya_pradesh">Madhya Pradesh</option>
              <option value="rajasthan">Rajasthan</option><option value="karnataka">Karnataka</option>
              <option value="gujarat">Gujarat</option><option value="tamil_nadu">Tamil Nadu</option>
              <option value="west_bengal">West Bengal</option><option value="delhi">Delhi</option>
              <option value="other">Other</option></select></label>
          <label><span data-i18n="area">Area</span>
            <select name="area"><option value=""></option>
              <option value="rural" data-i18n="rural">Rural</option>
              <option value="urban" data-i18n="urban">Urban</option></select></label>
          <label><span data-i18n="category">Social category</span>
            <select name="category"><option value=""></option>
              <option value="general">General</option><option value="obc">OBC</option>
              <option value="sc">SC</option><option value="st">ST</option></select></label>
        </div>
        <h3 class="section-label" data-i18n="quickQs">Quick questions</h3>
        <div class="yesno" id="yesno"></div>
        <button type="submit" class="primary" data-i18n="findSchemes">Find my schemes</button>
      </form>
      <div id="elig-results" class="elig-results"></div>
    </div>
  </section>

  <!-- DOCUMENTS -->
  <section id="tab-docs" class="panel">
    <div class="page">
      <div class="page-head">
        <h2 data-i18n="docsTitle">Scheme library</h2>
        <p data-i18n="docsIntro">Every answer comes only from these public documents.</p>
      </div>
      <div id="doc-list" class="doc-list"></div>
    </div>
  </section>
</div>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-card">
    <div class="modal-head">
      <div>
        <div id="modal-title" class="modal-title"></div>
        <div id="modal-sub" class="modal-sub"></div>
        <a id="modal-src" target="_blank" rel="noopener"></a>
      </div>
      <button id="modal-close" class="icon-btn ghost" aria-label="Close">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div id="modal-body" class="modal-body"></div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
